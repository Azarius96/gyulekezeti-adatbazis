services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gyulekezet
      POSTGRES_PASSWORD: gyulekezet_dev_pw
      POSTGRES_DB: gyulekezet
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
